services:
  - type: web
    name: nifty-paper-trading-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
    healthCheckPath: /health
    plan: free
